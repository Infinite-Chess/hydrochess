name: Build & Release WASM Engine

# Run this when code is pushed to the main branch
on:
  push:
    branches: ["main"]
  # Also allow clicking a button to run manually
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM (Web Target)
        run: wasm-pack build --target web

      - name: Read version from Cargo.toml
        id: version
        run: |
          # Read the crate version so the release tag carries the real Cargo version,
          # and suffix +build.<run_number> so every rebuild is a unique staleness key.
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/^version *= *"([^"]+)".*/\1/')
          echo "tag=v${VERSION}+build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Zip pkg/
        run: |
          # One zip preserves the snippets/ tree that apeiron.js imports; loose release
          # assets are flat and would drop it. -x drops dotfiles (e.g. pkg/.gitignore).
          cd pkg && zip -r ../apeiron-wasm.zip . -x ".*"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          # e.g. v2.0.0+build.47 — the consumer strips the leading v and everything from
          # + onward for the display version, and uses the full tag as the staleness key.
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          # Single archive of the full pkg/ (apeiron.js, apeiron_bg.wasm, snippets/, …).
          # Fixed name — the version lives in the tag, so no need to embed it here.
          files: |
            apeiron-wasm.zip

      - name: Trigger infinitechess.org deploy
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.INFINITECHESS_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/Infinite-Chess/infinitechess.org/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"prod"}'
